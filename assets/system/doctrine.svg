<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif" role="img" aria-label="Doctrine: six words, then the kill switches"><defs>
  <linearGradient id="ac" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#38bdf8"/><stop offset="1" stop-color="#a78bfa"/></linearGradient>
  <linearGradient id="btn" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2563eb"/><stop offset="1" stop-color="#38bdf8"/></linearGradient>
  <linearGradient id="bgg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1222"/><stop offset="1" stop-color="#070b16"/></linearGradient>
  <radialGradient id="glow" cx="0.85" cy="0.2" r="0.6"><stop offset="0" stop-color="#38bdf8" stop-opacity="0.16"/><stop offset="1" stop-color="#38bdf8" stop-opacity="0"/></radialGradient>
  <clipPath id="avatar"><circle cx="0" cy="0" r="1"/></clipPath>
  <style>
    .pulse { animation: p 2.2s ease-out infinite; } @keyframes p { 0% { opacity: .7; r: 6px; } 100% { opacity: 0; r: 16px; } }
    .row { opacity: 0; animation: in .5s ease forwards; } @keyframes in { to { opacity: 1; } }
    .blink { animation: b 1.1s steps(1) infinite; } @keyframes b { 50% { opacity: 0; } }
  </style>
</defs><rect x="1" y="1" width="1198" height="498" rx="20" fill="url(#bgg)" stroke="#1e2a44" stroke-width="2"/><rect x="40" y="34" width="97" height="38" rx="10" fill="#0f172a" stroke="#1e2a44"/><text x="88.5" y="58" font-size="14" fill="#38bdf8" font-weight="700" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', monospace" text-anchor="middle">NO GUESS</text><rect x="147" y="34" width="97" height="38" rx="10" fill="#0f172a" stroke="#1e2a44"/><text x="195.5" y="58" font-size="14" fill="#38bdf8" font-weight="700" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', monospace" text-anchor="middle">NO TRUST</text><rect x="254" y="34" width="122" height="38" rx="10" fill="#0f172a" stroke="#1e2a44"/><text x="315" y="58" font-size="14" fill="#38bdf8" font-weight="700" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', monospace" text-anchor="middle">GREEN CHECK</text><rect x="386" y="34" width="122" height="38" rx="10" fill="#0f172a" stroke="#1e2a44"/><text x="447" y="58" font-size="14" fill="#38bdf8" font-weight="700" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', monospace" text-anchor="middle">STOP ON RED</text><rect x="518" y="34" width="114" height="38" rx="10" fill="#0f172a" stroke="#1e2a44"/><text x="575" y="58" font-size="14" fill="#38bdf8" font-weight="700" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', monospace" text-anchor="middle">IDEMPOTENT</text><rect x="642" y="34" width="131" height="38" rx="10" fill="#0f172a" stroke="#1e2a44"/><text x="707.5" y="58" font-size="14" fill="#38bdf8" font-weight="700" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', monospace" text-anchor="middle">NO FAKE DONE</text><rect x="40" y="96" width="364" height="168" rx="14" fill="#0f172a" stroke="#1e2a44"/><text x="384" y="166" font-size="64" fill="#1e2a44" font-weight="800" text-anchor="end">1</text><text x="62" y="136" font-size="18" fill="#e6ecf8" font-weight="800">Stop at the endpoint</text><text x="62" y="172" font-size="14" fill="#8b9ab8">count ≠ pull ≠ deliver. fix ≠ commit ≠</text><text x="62" y="192" font-size="14" fill="#8b9ab8">push. Do the named step, then stop.</text><rect x="418" y="96" width="364" height="168" rx="14" fill="#0f172a" stroke="#1e2a44"/><text x="762" y="166" font-size="64" fill="#1e2a44" font-weight="800" text-anchor="end">3</text><text x="440" y="136" font-size="18" fill="#e6ecf8" font-weight="800">No auto-spend</text><text x="440" y="172" font-size="14" fill="#8b9ab8">No credits, no paid API calls, no purchases</text><text x="440" y="192" font-size="14" fill="#8b9ab8">without a named go.</text><rect x="796" y="96" width="364" height="168" rx="14" fill="#0f172a" stroke="#1e2a44"/><text x="1140" y="166" font-size="64" fill="#1e2a44" font-weight="800" text-anchor="end">4</text><text x="818" y="136" font-size="18" fill="#e6ecf8" font-weight="800">No client file until</text><text x="818" y="160" font-size="18" fill="#e6ecf8" font-weight="800">approved</text><text x="818" y="196" font-size="14" fill="#8b9ab8">Row count and ICP are approved first. A bad</text><text x="818" y="216" font-size="14" fill="#8b9ab8">list costs more than a late one.</text><rect x="40" y="278" width="364" height="168" rx="14" fill="#0f172a" stroke="#1e2a44"/><text x="384" y="348" font-size="64" fill="#1e2a44" font-weight="800" text-anchor="end">5</text><text x="62" y="318" font-size="18" fill="#e6ecf8" font-weight="800">No paid recommendation</text><text x="62" y="342" font-size="18" fill="#e6ecf8" font-weight="800">without a test</text><text x="62" y="378" font-size="14" fill="#8b9ab8">Prove it on a sample before proposing the</text><text x="62" y="398" font-size="14" fill="#8b9ab8">spend.</text><rect x="418" y="278" width="364" height="168" rx="14" fill="#0f172a" stroke="#1e2a44"/><text x="762" y="348" font-size="64" fill="#1e2a44" font-weight="800" text-anchor="end">7</text><text x="440" y="318" font-size="18" fill="#e6ecf8" font-weight="800">Verify before claim</text><text x="440" y="354" font-size="14" fill="#8b9ab8">&quot;Done&quot; means it ran and was observed</text><text x="440" y="374" font-size="14" fill="#8b9ab8">passing. Exit code 0 means compiled, never</text><text x="440" y="394" font-size="14" fill="#8b9ab8">works.</text></svg>