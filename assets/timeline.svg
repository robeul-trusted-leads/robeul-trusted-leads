<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="line" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#0B3FBF"/>
      <stop offset="0.6" stop-color="#2563EB"/>
      <stop offset="1" stop-color="#38BDF8"/>
    </linearGradient>
    <style>
      .ttl { fill: #e6edf3; font-size: 22px; font-weight: 700; }
      .sub { fill: #8b949e; font-size: 12px; }
      .yr  { fill: #7dd3fc; font-size: 13px; font-weight: 700; }
      .role { fill: #e6edf3; font-size: 14px; font-weight: 600; }
      .org { fill: #8b949e; font-size: 12px; }
      .node { opacity: 0; animation: pop 0.5s cubic-bezier(.2,.9,.3,1.3) forwards; }
      .n1 { animation-delay: 0.6s } .n2 { animation-delay: 1.0s } .n3 { animation-delay: 1.4s } .n4 { animation-delay: 1.8s }
      .pulse { animation: pulse 2.4s ease-in-out infinite; transform-origin: center; transform-box: fill-box; }
      @keyframes pop { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
      @keyframes pulse { 0%,100% { opacity: .25; transform: scale(1); } 50% { opacity: 0; transform: scale(2.2); } }
      .draw { stroke-dasharray: 760; stroke-dashoffset: 760; animation: draw 2.2s ease-out forwards; }
      @keyframes draw { to { stroke-dashoffset: 0; } }
    </style>
  </defs>
  <rect width="900" height="300" rx="16" fill="#0d1117"/>
  <rect x="0.5" y="0.5" width="899" height="299" rx="16" fill="none" stroke="#30363d"/>
  <text x="32" y="44" class="ttl">Experience</text>
  <text x="32" y="66" class="sub">Two US lead-generation companies, and the tooling built around them.</text>

  <line x1="70" y1="160" x2="830" y2="160" stroke="#21262d" stroke-width="4" stroke-linecap="round"/>
  <line class="draw" x1="70" y1="160" x2="830" y2="160" stroke="url(#line)" stroke-width="4" stroke-linecap="round"/>

  <g class="node n1">
    <circle class="pulse" cx="150" cy="160" r="10" fill="#3B82F6"/>
    <circle cx="150" cy="160" r="8" fill="#0d1117" stroke="#3B82F6" stroke-width="3"/>
    <text class="yr" x="150" y="128" text-anchor="middle">Aug 2024 →</text>
    <text class="role" x="150" y="196" text-anchor="middle">Head Data Engineer</text>
    <text class="org" x="150" y="214" text-anchor="middle">Trusted Leads · full-time, remote</text>
  </g>

  <g class="node n2">
    <circle class="pulse" cx="350" cy="160" r="10" fill="#E6007E"/>
    <circle cx="350" cy="160" r="8" fill="#0d1117" stroke="#E6007E" stroke-width="3"/>
    <text class="yr" x="350" y="128" text-anchor="middle">Aug 2024 →</text>
    <text class="role" x="350" y="196" text-anchor="middle">Senior Data Engineer</text>
    <text class="org" x="350" y="214" text-anchor="middle">Lead Gen Jay · contract, remote</text>
  </g>

  <g class="node n3">
    <circle class="pulse" cx="550" cy="160" r="10" fill="#2563EB"/>
    <circle cx="550" cy="160" r="8" fill="#0d1117" stroke="#2563EB" stroke-width="3"/>
    <text class="yr" x="550" y="128" text-anchor="middle">2025</text>
    <text class="role" x="550" y="196" text-anchor="middle">Distributed scraping orchestrator</text>
    <text class="org" x="550" y="214" text-anchor="middle">Trusted Leads · 7 n8n workflows</text>
  </g>

  <g class="node n4">
    <circle class="pulse" cx="750" cy="160" r="10" fill="#FF4D8D"/>
    <circle cx="750" cy="160" r="8" fill="#0d1117" stroke="#FF4D8D" stroke-width="3"/>
    <text class="yr" x="750" y="128" text-anchor="middle">2026 →</text>
    <text class="role" x="750" y="196" text-anchor="middle">Verification-gated agents</text>
    <text class="org" x="750" y="214" text-anchor="middle">T-Ex LLM Runpack</text>
  </g>

  <text class="sub" x="868" y="268" text-anchor="end">Bogura, Bangladesh · remote on US hours · Bengali, English</text>
</svg>
